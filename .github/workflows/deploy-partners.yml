# F91 partner portal CI: build + static assertions for partners/ (its own
# Astro app) on every change. DEPLOYMENT lives in the DevtegraLLC/partners
# repo, which PULLS this public repo and publishes its own GitHub Pages at
# partners.devtegra.com (one Pages site per repo, and org policy disables
# deploy keys, so push-based cross-repo publishing is out). After merging
# portal changes, trigger it with:
#   gh workflow run build.yml -R DevtegraLLC/partners
# (a daily cron there also catches drift).
name: Partner portal CI

on:
  push:
    branches: [main]
    paths: ['partners/**', '.github/workflows/deploy-partners.yml']
  pull_request:
    paths: ['partners/**', '.github/workflows/deploy-partners.yml']

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: partners
      - run: npm test
        working-directory: partners
